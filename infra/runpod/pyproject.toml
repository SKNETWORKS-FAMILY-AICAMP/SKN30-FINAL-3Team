[project]
name = "skn30-serving-runtime"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  # Direct dependencies of the route-allowlisted streaming authentication gateway.
  "aiohttp==3.14.3",
  "multidict==6.7.1",
  # vLLM 0.11 predates Transformers 5 and is validated against this 4.x line.
  "transformers==4.57.1",
  # 0.11.1 requires Torch 2.9; the pinned cu128 base supplies Torch 2.8.
  # The external gateway therefore denies the vulnerable /v1/completions route.
  "vllm[audio]==0.11.0",
]
