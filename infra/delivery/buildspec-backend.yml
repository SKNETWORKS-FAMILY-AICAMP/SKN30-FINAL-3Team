version: 0.2
env:
  shell: bash
  variables:
    DB_URL: "postgresql+psycopg://postgres:postgres@127.0.0.1:5432/brokerage"
    DB_MIGRATION_URL: "postgresql+psycopg://postgres:postgres@127.0.0.1:5432/brokerage"
    TEST_DB_URL: "postgresql+psycopg://postgres:postgres@127.0.0.1:5432/brokerage"
    APP_PROFILE: "test"
    APP_ENV: "test"
    DB_TARGET: "test"
    HTTP_CORS_ALLOWED_ORIGINS: "[]"
    HTTP_ALLOWED_HOSTS: '["localhost","127.0.0.1"]'
    AUTH_DEVELOPMENT_ENABLED: "false"
phases:
  install:
    runtime-versions:
      python: 3.13
    commands:
      - python -m pip install --disable-pip-version-check uv==0.11.2
  pre_build:
    commands:
      - test "${#CODEBUILD_RESOLVED_SOURCE_VERSION}" -eq 40
  build:
    commands:
      - export REVISION_SHA="${CODEBUILD_RESOLVED_SOURCE_VERSION}"
      - export TEST_DB_CONTAINER="brokerage-ci-${CODEBUILD_BUILD_NUMBER}"
      - docker run --detach --rm --name "${TEST_DB_CONTAINER}" -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=brokerage -p 5432:5432 pgvector/pgvector:pg15
      - for attempt in $(seq 1 30); do docker exec "${TEST_DB_CONTAINER}" pg_isready -U postgres && break; sleep 2; done
      - docker exec "${TEST_DB_CONTAINER}" pg_isready -U postgres
      - infra/delivery/scripts/verify_backend_ai.sh
      - aws ecr get-login-password --region "${AWS_REGION}" | docker login --username AWS --password-stdin "${ECR_REPOSITORY_URI%%/*}"
      - |
        EXISTING_DIGEST="$(aws ecr describe-images --repository-name "${ECR_REPOSITORY_NAME}" --image-ids imageTag="${REVISION_SHA}" --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)"
        if [[ "${EXISTING_DIGEST}" == sha256:* ]]; then
          IMAGE_DIGEST="${EXISTING_DIGEST}"
        else
          docker build --file backend/Dockerfile --tag "${ECR_REPOSITORY_URI}:${REVISION_SHA}" .
          docker push "${ECR_REPOSITORY_URI}:${REVISION_SHA}"
          IMAGE_DIGEST="$(aws ecr describe-images --repository-name "${ECR_REPOSITORY_NAME}" --image-ids imageTag="${REVISION_SHA}" --query 'imageDetails[0].imageDigest' --output text)"
        fi
        test "${IMAGE_DIGEST}" != "None"
        export IMAGE_DIGEST
        mkdir -p _backend_release
        cp infra/deploy/appspec.yml _backend_release/appspec.yml
        cp infra/deploy/compose.dev.yml _backend_release/compose.dev.yml
        cp -R infra/deploy/scripts _backend_release/scripts
        printf 'BACKEND_IMAGE=%s@%s\n' "${ECR_REPOSITORY_URI}" "${IMAGE_DIGEST}" > _backend_release/backend-image.env
        python infra/delivery/scripts/write_release_manifest.py \
          --output _backend_release/release-manifest.json \
          --pipeline "${PIPELINE_KIND}" \
          --revision "${REVISION_SHA}" \
          --execution "${PIPELINE_EXECUTION_ID}" \
          --image-digest "${IMAGE_DIGEST}" \
          --migration validated
    finally:
      - docker stop "brokerage-ci-${CODEBUILD_BUILD_NUMBER}" >/dev/null 2>&1 || true
artifacts:
  base-directory: _backend_release
  files:
    - '**/*'
