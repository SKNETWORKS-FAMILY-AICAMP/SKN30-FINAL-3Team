version: 0.2
env:
  shell: bash
phases:
  pre_build:
    commands:
      - ': "${APP_READINESS_PATH:?APP_READINESS_PATH is required}"'
      - curl -fsS --retry 3 "https://${CLOUDFRONT_DOMAIN}${APP_READINESS_PATH}"
  build:
    commands:
      - chmod +x deploy_frontend.sh
      - ./deploy_frontend.sh
