version: 0.2
env:
  shell: bash
phases:
  pre_build:
    commands:
      - ': "${APP_READINESS_PATH:?APP_READINESS_PATH is required}"'
      - |
        case "${APP_DEPLOYMENT_MODE:?APP_DEPLOYMENT_MODE is required}" in
          maintenance)
            echo "Maintenance static deployment; backend readiness is checked by dev-start."
            ;;
          automatic)
            curl -fsS --retry 3 "https://${CLOUDFRONT_DOMAIN}${APP_READINESS_PATH}"
            ;;
          *)
            echo "Unsupported APP_DEPLOYMENT_MODE" >&2
            exit 1
            ;;
        esac
  build:
    commands:
      - chmod +x deploy_frontend.sh
      - ./deploy_frontend.sh
