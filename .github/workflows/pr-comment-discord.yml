name: PR Comment Discord Notification

on:
  issue_comment:
    types:
      - created
  pull_request_review:
    types:
      - submitted
  pull_request_review_comment:
    types:
      - created

permissions:
  contents: read

jobs:
  notify:
    name: Notify Discord about human PR comments
    if: >-
      github.event.sender.type != 'Bot' &&
      (github.event_name != 'issue_comment' || github.event.issue.pull_request)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Notify Discord
        env:
          DISCORD_PR_WEBHOOK_URL: ${{ secrets.DISCORD_PR_WEBHOOK_URL }}
        run: node .github/scripts/pr-comment-discord.mjs
