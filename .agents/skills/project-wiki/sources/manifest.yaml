      ANCHOR_READY 어느 때든 사용자의 판정 요청이 같은 실행을 이어받아 진행. 주차 뒤의 계획된
      첫 선점은 재시도 횟수를 쓰지 않음. 세대 상세 액션 레일의 [교차 판정]을 여닫기에서 판정 요청으로
      되돌려 섹션의 [교차 판정 실행]과 같은 실행을 요청

