repos:
  - repo: local
    hooks:
      - id: ai-ruff-format
        name: ai ruff format
        entry: uv run --project ai ruff format --check ai/src ai/tests
        language: system
        pass_filenames: false
      - id: ai-ruff-check
        name: ai ruff check
        entry: uv run --project ai ruff check ai/src ai/tests
        language: system
        pass_filenames: false
      - id: ai-pyright
        name: ai pyright
        entry: uv run --project ai pyright --project ai/pyproject.toml
        language: system
        pass_filenames: false
