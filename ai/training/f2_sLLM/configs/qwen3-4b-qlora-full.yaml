model:
  id: Qwen/Qwen3-4B
  revision: main
  max_length: 2048

quantization:
  load_in_4bit: true
  quant_type: nf4
  use_double_quant: true
  compute_dtype: bfloat16

lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  learning_rate: 0.0001
  num_train_epochs: 3
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 16
  warmup_ratio: 0.05
  weight_decay: 0.01
  gradient_checkpointing: true
  logging_steps: 5
  eval_steps: 10
  save_steps: 10
  save_total_limit: 3
  seed: 20260820
