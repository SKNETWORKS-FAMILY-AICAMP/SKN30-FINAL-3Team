[project]
name = "brokerage-ai"
version = "0.1.0"
description = "Framework-neutral AI provider and workflow foundation for the brokerage service"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "langgraph>=1.2.11",
    "openai>=3.1.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["brokerage_ai"]
branch = true
