repos:
  - repo: local
    hooks:
      - id: backend-ruff-format
        name: backend ruff format
        entry: uv run --project backend ruff format --check backend/src backend/tests
        language: system
        pass_filenames: false
      - id: backend-ruff-check
        name: backend ruff check
        entry: uv run --project backend ruff check backend/src backend/tests
        language: system
        pass_filenames: false
      - id: backend-pyright
        name: backend pyright
        entry: uv run --project backend pyright --project backend/pyproject.toml
        language: system
        pass_filenames: false
