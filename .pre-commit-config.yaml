minimum_pre_commit_version: "4.6.2"
default_stages:
  - pre-commit

repos:
  - repo: local
    hooks:
      - id: ai-ruff-check-fix
        name: ai ruff check --fix
        entry: uv run --locked --project ai ruff check --fix
        language: system
        files: ^ai/(src|tests)/.*\.py$
        types:
          - python
      - id: ai-ruff-format
        name: ai ruff format
        entry: uv run --locked --project ai ruff format
        language: system
        files: ^ai/(src|tests)/.*\.py$
        types:
          - python
      - id: ai-pyright
        name: ai pyright
        entry: uv run --locked --project ai pyright --project ai/pyproject.toml
        language: system
        files: ^ai/(src|tests)/.*\.py$
        pass_filenames: false
      - id: backend-ruff-check-fix
        name: backend ruff check --fix
        entry: uv run --locked --project backend ruff check --fix
        language: system
        files: ^backend/(src|tests)/.*\.py$
        types:
          - python
      - id: backend-ruff-format
        name: backend ruff format
        entry: uv run --locked --project backend ruff format
        language: system
        files: ^backend/(src|tests)/.*\.py$
        types:
          - python
      - id: backend-pyright
        name: backend pyright
        entry: uv run --locked --project backend pyright --project backend/pyproject.toml
        language: system
        files: ^backend/(src|tests)/.*\.py$
        pass_filenames: false
